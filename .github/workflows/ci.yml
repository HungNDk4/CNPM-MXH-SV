name: CI — syntax and frontend build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-syntax:
    name: Backend JS syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Check JavaScript syntax (not integration tests)
        run: find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Build
        run: npm run build

  docs-integrity:
    name: Project control static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check project continuity documentation
        run: node scripts/check-project-control.mjs

  dep01-offline-smoke:
    name: DEP-01 offline Express/source probe (NOT cloud deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install source dependencies
        run: npm ci
      - name: Express handler HTTP smoke (no DB/cloud)
        run: node --test ../scripts/dep01-express-smoke.test.cjs
      - name: Source-only deployment blockers (NOT live tests)
        run: node ../scripts/dep01-readiness.mjs
      - name: Audit contract tests
        run: node --test ../scripts/dep01-readiness.test.mjs

  dep01-isolated-cloud-scaffold:
    name: DEP-01 isolated cloud scaffold tests (NOT Vercel deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/dep01-cloud-isolated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify standalone function source syntax
        run: node --check api/health.js
      - name: Isolated HTTP request/response security smoke, no cloud or secrets
        run: node --test test/health.test.cjs
      - name: Check Vercel configuration JSON and isolated package manifests
        run: node -e "const fs=require('fs');const config=JSON.parse(fs.readFileSync('vercel.json'));const p=JSON.parse(fs.readFileSync('package.json'));if(config.version!==2||Object.keys(p.dependencies||{}).length)process.exit(1)"

  ubuntu-mysql-integration:
    name: Ubuntu 24.04 + MySQL 8 integration (isolated DB)
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ubuntu_test_only_password
          MYSQL_DATABASE: mini_study_network
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pubuntu_test_only_password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: mini_study_network
      DB_USER: root
      DB_PASSWORD: ubuntu_test_only_password
      JWT_ACCESS_SECRET: ci_only_ubuntu_access_secret_not_for_any_other_environment_2026
      JWT_REFRESH_SECRET: ci_only_ubuntu_refresh_secret_not_for_any_other_environment_2026
      CLIENT_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install MySQL client (Ubuntu 24.04)
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Import SQL schema on disposable MySQL
        run: mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -p"$DB_PASSWORD" < database/schema.sql
      - name: Apply DOC-03 document_files migration (disposable DB)
        run: mysql --protocol=tcp -h127.0.0.1 -P3306 -uroot -p"$DB_PASSWORD" < database/migrations/20261021_document_files.sql
      - name: Install backend dependencies
        working-directory: server
        run: npm ci
      - name: Test API with real MySQL (no payment/PDF testing)
        working-directory: server
        run: node --test ../scripts/ubuntu/mysql-integration.test.cjs
      - name: DOC-03 PDF upload regression (disposable DB)
        working-directory: server
        run: node --test ../scripts/ubuntu/pdf-upload.test.cjs
      - name: DOC-04 authenticated PDF download regression
        working-directory: server
        run: node --test ../scripts/ubuntu/pdf-download.test.cjs
      - name: Check Ubuntu scripts shell syntax
        run: bash -n scripts/ubuntu/doctor.sh scripts/ubuntu/setup.sh
      - name: Verify original SQL columns match Sequelize timestamps
        run: |
          mysql --protocol=tcp -h127.0.0.1 -uroot -p"$DB_PASSWORD" -D mini_study_network -e "SHOW COLUMNS FROM likes LIKE 'updated_at'; SHOW COLUMNS FROM refresh_tokens LIKE 'updated_at';"

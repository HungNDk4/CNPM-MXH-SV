name: TEMP DEP01C Pin Blob Lockfile

on:
  push:
    branches:
      - feat/dep01c-render-tidb-blob-poc-20261022

permissions:
  contents: write

jobs:
  pin-blob-sdk-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate npm v3 lock using the pinned package manifest
        run: npm --prefix server install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit ONLY server/package-lock.json to the isolated feature branch
        run: |
          if git diff --quiet -- server/package-lock.json; then
            echo "No lockfile diff."
            exit 0
          fi
          test "${GITHUB_REF_NAME}" = "feat/dep01c-render-tidb-blob-poc-20261022"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/package-lock.json
          git commit -m "chore(dep01c): pin Blob SDK lockfile with npm"
          git push origin "HEAD:${GITHUB_REF_NAME}"

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">OwlMate — learn together</title>
  <desc id="desc">An original friendly green owl wearing round glasses and reading a golden open book, with the OwlMate wordmark.</desc>
  <defs>
    <linearGradient id="owlGreen" x1="44" y1="28" x2="228" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45C878"/>
      <stop offset="1" stop-color="#21A65B"/>
    </linearGradient>
    <linearGradient id="bookGold" x1="72" y1="174" x2="218" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD45C"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
  <!-- Mascot: bold, clean silhouette designed for light and dark backgrounds -->
  <g transform="translate(18 12)">
    <!-- ears and head/body silhouette -->
    <path d="M39 78C25 60 19 38 20 18L65 43C85 27 108 18 132 18C156 18 179 27 199 43L244 18C245 38 239 60 225 78C239 99 246 122 245 147C244 176 230 193 214 205L209 245C185 253 158 261 132 279C106 261 79 253 55 245L50 205C34 193 20 176 19 147C18 122 25 99 39 78Z" fill="url(#owlGreen)" stroke="#123D35" stroke-width="8" stroke-linejoin="round"/>
    <!-- ear insets -->
    <path d="M35 35L62 51L48 67C42 58 38 47 35 35Z" fill="#B7F2C8"/>
    <path d="M229 35L202 51L216 67C222 58 226 47 229 35Z" fill="#B7F2C8"/>
    <!-- glasses -->
    <path d="M42 98C42 83 53 74 69 74H94C111 74 121 85 121 101V123C121 143 108 155 89 155H73C54 155 42 142 42 123V98Z" fill="#FFF2D7" stroke="#123D35" stroke-width="8"/>
    <path d="M143 101C143 85 153 74 170 74H195C211 74 222 83 222 98V123C222 142 210 155 191 155H175C156 155 143 143 143 123V101Z" fill="#FFF2D7" stroke="#123D35" stroke-width="8"/>
    <path d="M121 104C128 99 136 99 143 104" stroke="#123D35" stroke-width="8" stroke-linecap="round"/>
    <circle cx="82" cy="113" r="12" fill="#123D35"/>
    <circle cx="182" cy="113" r="12" fill="#123D35"/>
    <circle cx="86" cy="109" r="3.5" fill="#FFFFFF"/>
    <circle cx="186" cy="109" r="3.5" fill="#FFFFFF"/>
    <!-- beak -->
    <path d="M119 139L145 139L132 158L119 139Z" fill="#F5A623" stroke="#123D35" stroke-width="4" stroke-linejoin="round"/>
    <!-- small cheek marks -->
    <ellipse cx="35" cy="143" rx="8" ry="5" fill="#F7A4BC"/>
    <ellipse cx="229" cy="143" rx="8" ry="5" fill="#F7A4BC"/>
    <!-- book and wings -->
    <path d="M32 180C64 172 95 181 132 203C169 181 200 172 232 180L226 246C190 250 158 260 132 279C106 260 74 250 38 246L32 180Z" fill="#FFF9E9" stroke="#123D35" stroke-width="8" stroke-linejoin="round"/>
    <path d="M32 180C64 172 95 181 132 203V279C106 260 74 250 38 246L32 180Z" fill="url(#bookGold)"/>
    <path d="M132 203C169 181 200 172 232 180L226 246C190 250 158 260 132 279V203Z" fill="#F9B52E"/>
    <path d="M132 203V279" stroke="#123D35" stroke-width="7" stroke-linecap="round"/>
    <path d="M51 197C72 194 91 200 108 210M51 215C72 212 91 218 108 228M213 197C192 194 173 200 156 210M213 215C192 212 173 218 156 228" stroke="#FFF8E7" stroke-width="4" stroke-linecap="round"/>
    <!-- subtle learning spark -->
    <path d="M249 83V101M240 92H258" stroke="#F5B82E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="16" cy="94" r="5" fill="#8B5CF6"/>
    <circle cx="252" cy="119" r="4" fill="#38BDF8"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(315 103)">
    <text x="0" y="0" fill="#123D35" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="850" letter-spacing="-2">Owl</text>
    <text x="0" y="55" fill="#239B57" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="850" letter-spacing="-2">Mate</text>
    <path d="M2 76H365" stroke="#D9E7DF" stroke-width="3" stroke-linecap="round"/>
    <text x="2" y="105" fill="#64766D" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="750" letter-spacing="1.4">LEARN TOGETHER. GROW SMARTER.</text>
  </g>
</svg>
